# LP es independiente de HOME. PostgreSQL privado, sin puertos 5432 públicos.
name: lp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 60s
    networks: [lp_private]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Falta AUTH_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [lp_private]


  automation-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["node", "scripts/automation-worker.mjs"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Falta POSTGRES_DB}
      PGUSER: lp_auth
      PGPASSWORD: ${AUTH_DB_PASSWORD:?Falta AUTH_DB_PASSWORD}
    networks: [lp_private]


  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Falta NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Falta NEXT_PUBLIC_SITE_URL}
      LP_ALLOWED_ORIGINS: ${LP_ALLOWED_ORIGINS:-https://kreyviapp.com,https://www.kreyviapp.com}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Falta POSTGRES_DB}
      PGUSER: lp_api
      PGPASSWORD: ${APP_DB_PASSWORD:?Falta APP_DB_PASSWORD}
      AUTH_PGUSER: lp_auth
      AUTH_PGPASSWORD: ${AUTH_DB_PASSWORD:?Falta AUTH_DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LP_ENABLE_QA_ACCESS: ${LP_ENABLE_QA_ACCESS:-true}
      LP_QA_OWNER_EMAIL: ${LP_QA_OWNER_EMAIL:-}
      LP_QA_COPY_EMAIL: ${LP_QA_COPY_EMAIL:-daksharomero@gmail.com}
      LP_ENABLE_MARKETING_SEND: ${LP_ENABLE_MARKETING_SEND:-false}
      LP_ENABLE_WHATSAPP_SEND: ${LP_ENABLE_WHATSAPP_SEND:-false}
      LP_ENABLE_PUSH_SEND: ${LP_ENABLE_PUSH_SEND:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_MARKETING_TEMPLATE: ${WHATSAPP_MARKETING_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es_MX}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOCODER_SEARCH_URL: ${GEOCODER_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_SERVICE_EMAIL: ${GOOGLE_WALLET_SERVICE_EMAIL:-}
      GOOGLE_WALLET_PRIVATE_KEY_B64: ${GOOGLE_WALLET_PRIVATE_KEY_B64:-}
      APPLE_WALLET_PASS_TYPE_ID: ${APPLE_WALLET_PASS_TYPE_ID:-}
      APPLE_WALLET_TEAM_ID: ${APPLE_WALLET_TEAM_ID:-}
      APPLE_WALLET_CERT_PEM_B64: ${APPLE_WALLET_CERT_PEM_B64:-}
      APPLE_WALLET_KEY_PEM_B64: ${APPLE_WALLET_KEY_PEM_B64:-}
      APPLE_WALLET_WWDR_PEM_B64: ${APPLE_WALLET_WWDR_PEM_B64:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      APPLE_OAUTH_SERVICE_ID: ${APPLE_OAUTH_SERVICE_ID:-}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID:-}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID:-}
      APPLE_OAUTH_PRIVATE_KEY_B64: ${APPLE_OAUTH_PRIVATE_KEY_B64:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3100:3000"
    networks: [lp_private]

networks:
  lp_private:

volumes:
  postgres_data:
  uploads:
