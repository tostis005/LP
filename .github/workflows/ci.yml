name: LP — Typecheck, build and SQL integrity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loyalty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: loyalty_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Supabase schema fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
      - name: Apply all database migrations
        run: |
          for sql in supabase/migrations/*.sql; do
            echo "Applying ${sql}"
            psql -v ON_ERROR_STOP=1 -f "$sql"
          done
          psql -v ON_ERROR_STOP=1 -f tests/sql/grants.sql
      - name: Exercise roles, purchases, limits and reversals
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/smoke.sql

# No production deploys, no contact with HOME or Contabo.
