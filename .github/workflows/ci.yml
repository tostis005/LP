name: LP - Calidad y PostgreSQL nativo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Probar control de origen de acceso por IP
        run: node tests/demo/origin.mjs
      - name: Configuración segura de SMTP Gmail
        run: node tests/demo/gmail-smtp.mjs
      - name: Validar script SSH de Gmail
        run: bash -n scripts/apply-gmail-credentials.sh
      - name: Solicitud push contextual en PWA
        run: node tests/demo/push-onboarding.mjs
      - name: Verificar sesion persistente y recuperacion push
        run: node tests/demo/push-session-recovery.mjs
      - name: Verificar prueba push autorreparable y enlace directo a tarjetas
        run: node tests/demo/push-recovery-card-deeplink.mjs
      - name: Comprobar ofertas, novedades y recuperación de notificaciones push
        run: node tests/demo/offers-inbox.mjs
      - name: Verificar campañas unificadas y facturación por canal
        run: node tests/demo/unified-campaigns.mjs
      - name: Verificar una sola confirmación y el acceso al detalle desde Android
        run: node tests/demo/campaign-push-navigation.mjs
      - name: Verificar permisos de imagenes en campanas
        run: node tests/demo/campaign-image-upload.mjs
      - name: Comprobar acceso al historial push del negocio
        run: node tests/demo/campaign-history-permissions.mjs
      - name: Generación y persistencia VAPID sin exponer secretos
        run: node tests/demo/push-vapid.mjs
      - name: Verificar iconos, mapa, premios y navegación del negocio
        run: node tests/demo/discovery-ux.mjs
      - name: Comprobar mapa limpio y selección única de negocio
        run: node tests/demo/discovery-map-clean.mjs
      - name: Verificar galería rellena Kreyv y estrellas por tarjeta en el mapa
        run: node tests/demo/kreyv-filled-icons-map.mjs
      - name: Revisar home Kreyv, iconos de categorías, contraste y móvil
        run: node tests/demo/home-polish.mjs
      - name: Verificar textos comerciales ES/EN, iconos y logotipo
        run: node tests/demo/landing.mjs
      - name: Verificar la marca Kreyv y sus dos paletas
        run: node tests/demo/brand-kreyv.mjs
      - name: Verificar paleta vinotinto y colores configurables
        run: node tests/demo/theme.mjs
      - name: Verificar experiencia final por rol, iconos, campañas y Wallet
        run: node tests/demo/release.mjs
      - name: Revisar experiencia comercial, navegación y control de sucursales
        run: node tests/demo/launch-polish.mjs
      - name: Verificar Wallet, ancho completo, empleados y consentimiento libre
        run: node tests/demo/wallet-navigation-consent.mjs
      - name: Verificar que toda la aplicación usa datos reales
        run: node tests/demo/real-production.mjs
      - name: Validar fidelización, moneda, mapa y catálogo de regalos
        run: node tests/demo/product-polish.mjs
      - name: Verificar acceso rápido de perfiles con autorización por correo
        run: node tests/demo/qa-access.mjs
      - name: Comprobar limites de acceso legitimos y proteccion antiabuso
        run: node tests/demo/auth-rate-limits.mjs
      - name: Evitar caída del cliente cuando faltan detalles de una tarjeta
        run: node tests/demo/customer-resilience.mjs
      - name: Validar app simplificada, confirmaciones y tres canales de avisos
        run: node tests/demo/simplified-business-app.mjs
      - name: Validar inscripción con único permiso y ajustes individuales por tarjeta
        run: node tests/demo/customer-notification-settings.mjs
      - name: Validar perfil del cliente, QR adaptable y consentimiento general
        run: node tests/demo/customer-profile-final.mjs
      - name: Comprobar navegación del cliente hacia sus ajustes
        run: node tests/demo/push-navigation.mjs
      - name: Verificar Wallet y QR ampliado
        run: node tests/demo/wallet-fullscreen-qr.mjs
      - name: Verificar paleta clara del cliente, contraste y usabilidad móvil
        run: node tests/demo/customer-visual-balance.mjs
      - name: Verificar Tarjeta del dueño y flujos automáticos sin ejemplos
        run: node tests/demo/owner-final-card-flows.mjs
      - name: Validar informes e imágenes del ejemplo Café Noma
        run: node tests/demo/owner-noma-polish.mjs
      - name: Verificar Café Noma, notificaciones y mapa sin navegación duplicada
        run: node tests/demo/noma-163-customer-ux.mjs
      - name: Validar informes y campañas automáticas del dueño
        run: node tests/demo/owner-growth-automation.mjs
      - name: Validar roles, crecimiento y flujos automáticos
        run: node tests/demo/owner-growth-automation.mjs
      - name: Comprobar TypeScript
        run: npm run typecheck
      - name: Construir Next.js
        run: npm run build
      - name: Verificar PNG y favicon Kreyv de la compilación
        run: node scripts/verify-kreyv-brand-assets.mjs
      - name: Confirmar que SMTP está incluido en la imagen standalone
        run: cd .next/standalone && node -e "require.resolve('nodemailer')"
      - name: Verificar la portada dentro de una imagen Docker real
        shell: bash
        run: |
          set -euo pipefail
          docker build --target runner --build-arg NEXT_PUBLIC_SITE_URL=https://169.58.121.198 -t lp-root-smoke .
          container_id="$(docker run -d -e HOSTNAME=0.0.0.0 -p 127.0.0.1:3156:3000 lp-root-smoke)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          ready=false
          for i in $(seq 1 35); do
            if curl -fsS --max-time 5 http://127.0.0.1:3156/ -o /tmp/lp-root-smoke.html 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs "$container_id" --tail 80
            echo "::error::La imagen Docker no responde en /"
            exit 1
          fi
          if ! grep -q "Tarjetas de fidelización" /tmp/lp-root-smoke.html || grep -q "Preparando tu espacio" /tmp/lp-root-smoke.html; then
            echo "::error::Docker sigue devolviendo el router de acceso en la raiz."
            grep -oE "Preparando tu espacio|Accede a tu espacio|Tarjetas de fidelización" /tmp/lp-root-smoke.html || true
            exit 1
          fi
          curl -fsS --max-time 8 'http://127.0.0.1:3156/?lang=en' -o /tmp/lp-root-en.html
          if ! grep -q 'Digital loyalty cards' /tmp/lp-root-en.html ||
             grep -q 'Tarjetas de fidelización' /tmp/lp-root-en.html; then
            echo "::error::Docker no devuelve la portada en inglés."
            exit 1
          fi
          if ! grep -q 'href="/?lang=es"' /tmp/lp-root-en.html; then
            echo "::error::El selector no ofrece volver a español."
            exit 1
          fi
          echo "OK: Docker ofrece la portada comercial en español e inglés."
      - name: Verificar que la raiz sirve la presentacion y no el login
        shell: bash
        run: |
          set -euo pipefail
          PORT=3155 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/loyally-root.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3155/ -o /tmp/loyally-root.html 2>/dev/null; then break; fi
            sleep 1
          done
          if ! grep -q 'Tarjetas de fidelización' /tmp/loyally-root.html; then
            echo "::error::La raiz / no muestra la presentacion de Loyally."
            grep -oE 'Preparando tu espacio|Accede a tu espacio|Tarjetas de fidelización' /tmp/loyally-root.html || true
            tail -35 /tmp/loyally-root.log
            exit 1
          fi
          if grep -q 'Preparando tu espacio' /tmp/loyally-root.html; then
            echo "::error::La raiz / esta mostrando el router de acceso."
            exit 1
          fi
          echo "La raiz / muestra la presentacion de Loyally."

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lp_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      POSTGRES_DB: lp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_DB_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar cliente PostgreSQL
        run: npm install --no-audit --no-fund
      - name: Aplicar migraciones nativas
        run: npm run db:migrate
      - name: Verificar aislamiento de roles
        run: node tests/native/smoke.mjs
      - name: Validar iconos rellenos Kreyv en PostgreSQL
        run: node tests/native/kreyv-icons.mjs
      - name: Validar colas automáticas y permisos PostgreSQL
        run: node tests/native/growth-automation.mjs
      - name: Probar altas y canjes en flujos automáticos reales
        run: node tests/native/automation-flow.mjs
      - name: Probar catálogo completo de disparadores en PostgreSQL
        run: node tests/native/automation-trigger-catalog.mjs
      - name: Validar muestra de Café Noma en PostgreSQL
        run: node tests/native/cafe-noma-example.mjs
      - name: Comprobar permisos, métricas y colas automáticas en PostgreSQL
        run: node tests/native/growth-automation.mjs
      - name: Crear sandbox real de Tijuana y verificar QR, privacidad y tarifas
        env:
          LP_SANDBOX_MODE: "true"
          LP_DEMO_PASSWORD: "Prueba-Loyally-2026-Solo-CI!"
        run: |
          npm run db:seed:tijuana
          node tests/native/tijuana.mjs
          node tests/native/oauth.mjs
          node tests/native/theme.mjs
          node tests/native/release.mjs
          node tests/native/business-governance.mjs
          node tests/native/push.mjs
          node tests/native/platform-optin.mjs
      - name: Crear cuentas reales internas y comprobar QR, sellos y tarifas
        env:
          LP_SHOWCASE_ADMIN_PASSWORD: "Test-Admin-Loyally-2026-Private-A"
          LP_SHOWCASE_BUSINESS_PASSWORD: "Test-Business-Loyally-2026-Private-B"
          LP_SHOWCASE_STAFF_PASSWORD: "Test-Staff-Loyally-2026-Private-C"
          LP_SHOWCASE_CUSTOMER_PASSWORD: "Test-Customer-Loyally-2026-Private-D"
        run: |
          node scripts/provision-showcase-real.mjs
          node tests/native/noma-owner-163.mjs
          node tests/native/real-production.mjs
          node tests/native/business-asset-uploads.mjs
          node tests/native/campaign-history-permissions.mjs
          node tests/native/product-polish.mjs
          node tests/native/customer-home.mjs
          node tests/native/customer-channel-consent.mjs
