name: Desplegar LP automaticamente en Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lp-production
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Build de Next.js
        run: npm run build

  verificar-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lp_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      POSTGRES_DB: lp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_DB_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Migraciones
        run: npm run db:migrate
      - name: Comprobar aislamiento de datos
        run: node tests/native/smoke.mjs

  desplegar:
    if: github.ref == 'refs/heads/main'
    needs: [verificar, verificar-postgresql]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar acceso SSH con los secretos existentes del repositorio
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          LP_SSH_KNOWN_HOSTS: ${{ secrets.LP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" ]]; then
            echo "::error::Falta VPS_HOST, VPS_USER o VPS_SSH_KEY en Repository secrets o en el entorno production."
            exit 1
          fi
          PORT="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          # La clave del secreto puede incluir CRLF al copiarse desde Windows.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_deploy" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY no es una clave privada SSH válida sin frase de paso."
            exit 1
          fi
          # Opción recomendada: verificar y fijar previamente la clave de host
          # en LP_SSH_KNOWN_HOSTS. Si no está configurada, se utiliza TOFU
          # mediante ssh-keyscan (confianza en el primer contacto).
          if [[ -n "$LP_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$LP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "::notice::LP_SSH_KNOWN_HOSTS no configurado: se comprueba la clave de host mediante ssh-keyscan sin huella prevalidada. Para mayor seguridad, fija la huella verificada."
            ssh-keyscan -T 15 -p "$PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! [[ -s "$HOME/.ssh/known_hosts" ]]; then
            echo "::error::No fue posible obtener la clave pública SSH del VPS."
            exit 1
          fi
          echo "Identidad SSH configurada. Conexión a Contabo preparada."

      - name: Publicar únicamente Loyally en Contabo
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/lp
          test -f .env.production
          if ! test -r .env.production; then
            echo "ERROR: el usuario de despliegue no tiene permisos de lectura sobre /opt/lp/.env.production."
            exit 1
          fi
          for key in APP_DB_PASSWORD AUTH_DB_PASSWORD; do
            if ! grep -q "^$key=" .env.production; then
              printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> .env.production
            fi
          done
          git fetch --no-tags origin main
          if git show-ref --verify --quiet refs/heads/main; then
            git switch main
          else
            git switch -c main --track origin/main
          fi
          git pull --ff-only origin main
          docker compose --env-file .env.production config --quiet
          docker compose --env-file .env.production up -d --build --remove-orphans
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:3100/api/health >/dev/null; then
              echo "Loyally responde correctamente en el puerto 3100."
              exit 0
            fi
            sleep 3
          done
          echo "Loyally no superó la comprobación de salud."
          docker compose --env-file .env.production ps
          docker compose --env-file .env.production logs --tail 100 web
          exit 1
          REMOTE
