name: Desplegar LP automaticamente en Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lp-production
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar iconos, mapa, premios y navegación del negocio
        run: node tests/demo/discovery-ux.mjs
      - name: Comprobar mapa limpio y selección única de negocio
        run: node tests/demo/discovery-map-clean.mjs
      - name: Verificar galería rellena Kreyv y estrellas por tarjeta en el mapa
        run: node tests/demo/kreyv-filled-icons-map.mjs
      - name: Revisar home Kreyv, iconos de categorías, contraste y móvil
        run: node tests/demo/home-polish.mjs
      - name: Textos bilingües y colección visual
        run: node tests/demo/landing.mjs
      - name: Verificar marcadores de premios intermedios
        run: node tests/demo/stamp-milestone-markers.mjs
      - name: Verificar centro de ayuda y enlace de Wallet
        run: node tests/demo/help-support.mjs
      - name: Comprobar ofertas, novedades y recuperación de notificaciones push
        run: node tests/demo/offers-inbox.mjs
      - name: Verificar campañas unificadas y facturación por canal
        run: node tests/demo/unified-campaigns.mjs
      - name: Verificar una sola confirmación y el acceso al detalle desde Android
        run: node tests/demo/campaign-push-navigation.mjs
      - name: Verificar permisos de imagenes en campanas
        run: node tests/demo/campaign-image-upload.mjs
      - name: Comprobar acceso al historial push del negocio
        run: node tests/demo/campaign-history-permissions.mjs
      - name: Comprobar limites de acceso legitimos y proteccion antiabuso
        run: node tests/demo/auth-rate-limits.mjs
      - name: Verificar generación segura de claves Web Push
        run: node tests/demo/push-vapid.mjs
      - name: Verificar sesion persistente y recuperacion push
        run: node tests/demo/push-session-recovery.mjs
      - name: Verificar prueba push autorreparable y enlace directo a tarjetas
        run: node tests/demo/push-recovery-card-deeplink.mjs
      - name: Validar perfil, QR y notificaciones del cliente
        run: node tests/demo/customer-profile-final.mjs
      - name: Verificar Wallet y QR ampliado
        run: node tests/demo/wallet-fullscreen-qr.mjs
      - name: Verificar paleta clara del cliente, contraste y usabilidad móvil
        run: node tests/demo/customer-visual-balance.mjs
      - name: Verificar Tarjeta del dueño y flujos automáticos sin ejemplos
        run: node tests/demo/owner-final-card-flows.mjs
      - name: Comprobar tarjeta visual, QR y datos interactivos del negocio
        run: node tests/demo/owner-card-chart-priority.mjs
      - name: Verificar navegación y asistencia administrativa
        run: node --experimental-strip-types tests/demo/admin-routes.mjs
      - name: Validar formularios anchos, accesos, fotos pequeñas y estado demo
        run: node tests/demo/owner-desktop-images-marketing.mjs
      - name: Validar panel de Datos del propietario
        run: node tests/demo/owner-data-panel.mjs
      - name: Verificar informes, fechas e imágenes de tarjeta
        run: node tests/demo/owner-noma-polish.mjs
      - name: Verificar navegacion y notificaciones
        run: node tests/demo/noma-163-customer-ux.mjs
      - name: Verificar tarjetas optimizadas e informes de Café Noma
        run: node tests/demo/owner-noma-polish.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Build de Next.js
        run: npm run build
      - name: Verificar PNG y favicon Kreyv de la compilación
        run: node scripts/verify-kreyv-brand-assets.mjs
      - name: Verificar que la raiz sirve la presentacion y no el login
        shell: bash
        run: |
          set -euo pipefail
          PORT=3155 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/loyally-root.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3155/ -o /tmp/loyally-root.html 2>/dev/null; then break; fi
            sleep 1
          done
          if ! grep -Fq 'Tus lugares favoritos.' /tmp/loyally-root.html ||
             ! grep -Fq 'href="/para-negocios"' /tmp/loyally-root.html; then
            echo "::error::La raiz / no muestra la presentación de Kreyv."
            grep -oE 'Preparando tu espacio|Accede a tu espacio|Más clientes. Más visitas.' /tmp/loyally-root.html || true
            tail -35 /tmp/loyally-root.log
            exit 1
          fi
          if grep -q 'Preparando tu espacio' /tmp/loyally-root.html; then
            echo "::error::La raiz / esta mostrando el router de acceso."
            exit 1
          fi
          echo "La raiz / muestra la presentación de Kreyv."

  verificar-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lp_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      POSTGRES_DB: lp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_DB_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Migraciones
        run: npm run db:migrate
      - name: Comprobar aislamiento de datos
        run: node tests/native/smoke.mjs
      - name: Verificar permisos geográficos de marketing
        run: node tests/native/crm-marketing-scopes.mjs
      - name: Validar modo offline y premios intermedios
        run: node tests/native/offline-milestones.mjs
      - name: Validar permisos del historial comercial
        run: node tests/native/crm-mail-history.mjs
      - name: Validar iconos rellenos Kreyv en PostgreSQL
        run: node tests/native/kreyv-icons.mjs

  desplegar:
    if: github.ref == 'refs/heads/main'
    needs: [verificar, verificar-postgresql]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar acceso SSH con los secretos existentes del repositorio
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          LP_SSH_KNOWN_HOSTS: ${{ secrets.LP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" ]]; then
            echo "::error::Falta VPS_HOST, VPS_USER o VPS_SSH_KEY en Repository secrets o en el entorno production."
            exit 1
          fi
          PORT="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          # La clave del secreto puede incluir CRLF al copiarse desde Windows.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_deploy" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY no es una clave privada SSH válida sin frase de paso."
            exit 1
          fi
          # Opción recomendada: verificar y fijar previamente la clave de host
          # en LP_SSH_KNOWN_HOSTS. Si no está configurada, se utiliza TOFU
          # mediante ssh-keyscan (confianza en el primer contacto).
          if [[ -n "$LP_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$LP_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
            LOOKUP="$VPS_HOST"
            if [[ "$PORT" != 22 ]]; then LOOKUP="[$VPS_HOST]:$PORT"; fi
            if ! ssh-keygen -F "$LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
              # Accept one explicitly supplied public host key, with or without a hostname.
              # Never obtain a replacement key from the network or disable strict checking.
              PIN=$(awk 'NF && $1 !~ /^#/ { n++; if ($1 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$1 " " $2 } else if ($1 !~ /^@/ && $2 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$2 " " $3 } } END { if(n==1 && k!="") print k; else exit 1 }' "$HOME/.ssh/known_hosts") || { echo 'CRM_DIAG invalid_host_key_format'; exit 2; }
              printf '%s %s\n' "$LOOKUP" "$PIN" > "$HOME/.ssh/known_hosts"
              if ! ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then echo 'CRM_DIAG invalid_host_key_format'; exit 2; fi
              echo 'CRM_DIAG pinned_host_key_format_normalized'
            fi
          else
            echo "::notice::LP_SSH_KNOWN_HOSTS no configurado: se comprueba la clave de host mediante ssh-keyscan sin huella prevalidada. Para mayor seguridad, fija la huella verificada."
            ssh-keyscan -T 15 -p "$PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! [[ -s "$HOME/.ssh/known_hosts" ]]; then
            echo "::error::No fue posible obtener la clave pública SSH del VPS."
            exit 1
          fi
          echo "Identidad SSH configurada. Conexión a Contabo preparada."

      - name: Publicar únicamente Loyally en Contabo
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/lp
          test -f .env.production || { echo "ERROR: falta /opt/lp/.env.production"; exit 1; }

          # No cambiar propietarios ni permisos de los secretos de producción.
          # Si la cuenta SSH no puede leerlos directamente, usar sudo sin interacción.
          ENV_CMD=()
          if ! test -r .env.production; then
            if sudo -n test -r .env.production; then
              ENV_CMD=(sudo -n)
            else
              echo "ERROR: .env.production no es legible y la cuenta SSH no dispone de sudo -n."
              exit 1
            fi
          fi
          for key in APP_DB_PASSWORD AUTH_DB_PASSWORD; do
            if ! "${ENV_CMD[@]}" grep -q "^${key}=" .env.production; then
              printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" | "${ENV_CMD[@]}" tee -a .env.production >/dev/null
            fi
          done

          # El código solo se actualiza si puede hacerse sin sobrescribir cambios locales.
          GIT_CMD=(git)
          if ! test -w .git; then
            if sudo -n test -w .git; then
              GIT_CMD=(sudo -n git -c safe.directory=/opt/lp)
            else
              echo "ERROR: no hay permisos para actualizar /opt/lp/.git."
              exit 1
            fi
          fi
          "${GIT_CMD[@]}" fetch --no-tags origin main
          if "${GIT_CMD[@]}" show-ref --verify --quiet refs/heads/main; then
            "${GIT_CMD[@]}" switch main
          else
            "${GIT_CMD[@]}" switch -c main --track origin/main
          fi
          "${GIT_CMD[@]}" pull --ff-only origin main
          if [[ "$("${GIT_CMD[@]}" rev-parse HEAD)" != "$1" ]]; then
            echo "Hay una revisión más reciente; no se despliega un commit que este workflow no ha verificado."
            exit 1
          fi

          # Ejecutar Compose como root cuando el fichero de entorno está protegido
          # o cuando la cuenta de despliegue no tiene acceso al socket de Docker.
          COMPOSE=(docker compose)
          if ((${#ENV_CMD[@]})) || ! docker info >/dev/null 2>&1; then
            if ! sudo -n docker info >/dev/null 2>&1; then
              echo "ERROR: Docker requiere permisos que la cuenta SSH no tiene."
              exit 1
            fi
            COMPOSE=(sudo -n docker compose)
          fi
          # Generación inicial VAPID dentro del VPS. Nunca pasa por GitHub Secrets
          # ni se imprime en los logs. Respeta futuras desactivaciones explícitas.
          DOCKER=(docker)
          if ((${#ENV_CMD[@]})) || ! docker info >/dev/null 2>&1; then
            DOCKER=(sudo -n docker)
          fi
          "${DOCKER[@]}" run --rm --network none \
            --mount "type=bind,source=$PWD/.env.production,target=/loyally/.env.production" \
            --mount "type=bind,source=$PWD/scripts/setup-push-env.mjs,target=/setup-push-env.mjs,readonly" \
            node:22-bookworm-slim node /setup-push-env.mjs /loyally/.env.production --kreyvi-production

          "${COMPOSE[@]}" --env-file .env.production config --quiet
          # Construir y comprobar la imagen candidata antes de sustituir el servicio activo.
          "${COMPOSE[@]}" --env-file .env.production build
          candidate="$("${DOCKER[@]}" run -d --rm -p 127.0.0.1::3000 lp-web:latest)"
          trap '"${DOCKER[@]}" rm -f "$candidate" >/dev/null 2>&1 || true' EXIT
          candidate_port="$("${DOCKER[@]}" port "$candidate" 3000/tcp | sed -n 's/^127\.0\.0\.1://p' | head -1)"
          test -n "$candidate_port"
          candidate_ok=false
          for attempt in $(seq 1 20); do
            if bash scripts/check-public-pages.sh "http://127.0.0.1:$candidate_port"; then candidate_ok=true; break; fi
            sleep 2
          done
          if [[ "$candidate_ok" != true ]]; then
            "${DOCKER[@]}" logs --tail 50 "$candidate"
            echo "ERROR: la imagen candidata no sirve las páginas públicas; no se sustituye producción."
            exit 1
          fi
          "${DOCKER[@]}" rm -f "$candidate" >/dev/null
          trap - EXIT
          "${COMPOSE[@]}" --env-file .env.production up -d --no-build --remove-orphans
          # Verificación de solo lectura: no expone usuarios, identificadores ni mensajes.
          "${COMPOSE[@]}" --env-file .env.production exec -T db sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'NOMA_SQL'
          WITH target AS (
            SELECT id FROM public.businesses WHERE slug='interno-cafe-noma' AND name='Café Noma'
          ), visible AS (
            SELECT o.id FROM public.business_offers o JOIN target t ON t.id=o.business_id
            WHERE o.archived_at IS NULL AND NOT EXISTS(SELECT 1 FROM public.automation_rules a WHERE a.offer_id=o.id)
            UNION ALL
            SELECT c.id FROM public.marketing_campaigns c JOIN target t ON t.id=c.business_id
            WHERE c.offer_id IS NULL AND NOT EXISTS(SELECT 1 FROM public.demo_hidden_campaigns h WHERE h.business_id=c.business_id AND h.campaign_id=c.id)
            UNION ALL
            SELECT p.id FROM public.push_campaigns p JOIN target t ON t.id=p.business_id
            WHERE NOT EXISTS(SELECT 1 FROM public.business_offers o WHERE o.push_campaign_id=p.id)
            AND NOT EXISTS(SELECT 1 FROM public.demo_hidden_campaigns h WHERE h.business_id=p.business_id AND h.campaign_id=p.id)
          )
          SELECT (SELECT count(*) FROM target) AS noma_negocio_encontrado,
                 (SELECT count(*) FROM visible) AS noma_campanas_manuales_visibles,
                 EXISTS(SELECT 1 FROM public.local_schema_migrations WHERE name='999_zzzz_noma_keep_two_campaigns.sql') AS noma_limpieza_aplicada,
                 EXISTS(SELECT 1 FROM public.local_schema_migrations WHERE name='999_zzzzz_card_notification_defaults.sql') AS avisos_migracion_aplicada;
          NOMA_SQL

          # La producción no crea negocios ni usuarios ficticios. Los datos
          # y permisos existentes permanecen intactos durante el despliegue.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:3100/api/health >/dev/null &&
               bash scripts/check-public-pages.sh "http://127.0.0.1:3100"; then
              # Evitar que un enlace de vista previa o una sección interna vuelva a responder 404/500.
              for route in /negocio /negocio/poster /negocio/reports /negocio/transactions /negocio/customers /negocio/marketing /negocio/vista-previa /app/descubrir /api/local/wallet/status /api/local/marketing/status /kreyv-mark-v3.svg /kreyv-mark-v3-192.png /kreyv-mark-v3-512.png /kreyv-favicon-v3.svg /kreyv-apple-touch-v3.png /manifest.webmanifest; do
                if ! curl -fsS --max-time 12 "http://127.0.0.1:3100${route}" >/dev/null; then
                  echo "ERROR: la sección ${route} no responde correctamente tras el despliegue."
                  exit 1
                fi
              done
              # Requerir HTTPS público realmente verificable y push activo,
              # no basta con la respuesta del contenedor por HTTP interno.
              SITE="$("${ENV_CMD[@]}" grep '^NEXT_PUBLIC_SITE_URL=' .env.production | tail -n 1 | cut -d= -f2-)"
              SITE="${SITE%/}"
              if ! [[ "$SITE" == https://* ]] ||
                 ! push_config="$(curl -fsS --max-time 15 "$SITE/api/local/push/config")" ||
                 ! grep -Eq '"enabled"[[:space:]]*:[[:space:]]*true' <<< "$push_config"; then
                echo "ERROR: no se ha podido verificar Web Push por HTTPS público con certificado válido."
                exit 1
              fi
              bash scripts/check-public-pages.sh "$SITE"
              echo "Kreyv responde correctamente: home ES/EN, negocio, campañas, Wallet y Web Push HTTPS activo."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: no se han superado las comprobaciones de salud y páginas públicas del servicio."
          "${COMPOSE[@]}" --env-file .env.production ps
          "${COMPOSE[@]}" --env-file .env.production logs --tail 100 web
          exit 1
          REMOTE
