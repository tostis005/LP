name: Diagnosticar entrada publica de Loyally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar-rutas:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar raiz publica y acceso de la IP
        shell: bash
        run: |
          set -u
          for url in "https://kreyvi.com/" "https://kreyvi.com/" "https://kreyvi.com/acceder"; do
            echo "===== $url ====="
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -k -sS --max-time 18 -D "$headers" -o "$body" -w "%{http_code}" "$url" || true)"
            echo "HTTP: $code"
            grep -Ei '^(HTTP/|location:|server:)' "$headers" || true
            if grep -q "Tarjetas de fidelización" "$body"; then
              echo "CONTENIDO: PRESENTACION LOYALLY"
            elif grep -q "Accede a tu espacio" "$body"; then
              echo "CONTENIDO: LOGIN /ACCEDeR"
            elif grep -q "Falta un paso para empezar" "$body"; then
              echo "CONTENIDO: ERROR APLICACION"
            else
              echo "CONTENIDO: NO IDENTIFICADO"
            fi
            node - "$body" <<'NODE'
          const fs=require("node:fs");
          const html=fs.readFileSync(process.argv[2],"utf8");
          const extract=(regex)=>{const match=html.match(regex);return match?match[1].replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,200):"sin etiqueta"};
          console.log("TITLE:",extract(/<title[^>]*>([\s\S]*?)<\/title>/i));
          console.log("H1:",extract(/<h1[^>]*>([\s\S]*?)<\/h1>/i));
          console.log("BODY_FIRST:",html.slice(0,320).replace(/\s+/g," "));
          for(const phrase of ["Preparando tu espacio", "Redirigiendo al acceso", "Loyally transforma", "Accede a tu espacio", "Tarjetas de fidelización"]){
            if(html.includes(phrase))console.log("MARCADOR:",phrase);
          }
          NODE
            rm -f "$headers" "$body"
          done

  revisar-proxy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Comparar Next.js directo con Caddy y revisar solo rutas relevantes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          LP_SSH_KNOWN_HOSTS: ${{ secrets.LP_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          if [[ -n "$LP_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$LP_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
            LOOKUP="$VPS_HOST"
            if [[ "$PORT" != 22 ]]; then LOOKUP="[$VPS_HOST]:$PORT"; fi
            if ! ssh-keygen -F "$LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
              # Accept one explicitly supplied public host key, with or without a hostname.
              # Never obtain a replacement key from the network or disable strict checking.
              PIN=$(awk 'NF && $1 !~ /^#/ { n++; if ($1 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$1 " " $2 } else if ($1 !~ /^@/ && $2 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$2 " " $3 } } END { if(n==1 && k!="") print k; else exit 1 }' "$HOME/.ssh/known_hosts") || { echo 'CRM_DIAG invalid_host_key_format'; exit 2; }
              printf '%s %s\n' "$LOOKUP" "$PIN" > "$HOME/.ssh/known_hosts"
              if ! ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then echo 'CRM_DIAG invalid_host_key_format'; exit 2; fi
              echo 'CRM_DIAG pinned_host_key_format_normalized'
            fi
          else
            ssh-keyscan -T 15 -p "$PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          cd /opt/lp
          echo "DEPLOYED_GIT: $(git log -1 --format=%h)"
          for path in / /entrar /acceder; do
            tmp="$(mktemp)"
            status="$(curl -sS --max-time 15 -o "$tmp" -w "%{http_code}" "http://127.0.0.1:3100$path" || true)"
            echo "NEXT_DIRECT: $path = $status"
            for phrase in "Tarjetas de fidelización" "Preparando tu espacio" "Accede a tu espacio"; do
              if grep -q "$phrase" "$tmp"; then echo "MARKER: $phrase"; fi
            done
            rm -f "$tmp"
          done
          echo "GIT_ALL_STATUS:"
          git status --short | head -60 || true
          echo "COMPOSE_FILES:"
          find . -maxdepth 1 -iname '*compose*' -print | sort
          echo "APP_ROUTING_FILES:"
          find . -maxdepth 5 -type f -name 'page.tsx' -not -path './node_modules/*' -not -path './.next/*' | sort | head -90
          echo "COMPOSE_WEB_BUILD_CONTEXT:"
          docker compose --env-file .env.production config --format json | docker exec -i lp-web-1 node -e 'let raw="";process.stdin.on("data",x=>raw+=x);process.stdin.on("end",()=>{const c=JSON.parse(raw),s=c.services.web;console.log(JSON.stringify({context:s.build?.context,dockerfile:s.build?.dockerfile,image:s.image,volumes:s.volumes?.map(v=>({source:v.source,target:v.target}))}));})'
          echo "LOCAL_WORKTREE_STATUS:"
          git status --short -- app/page.tsx || true
          echo "LOCAL_LANDING_PRESENT:"
          if grep -q "Tarjetas de fidelización" app/page.tsx; then echo YES; else echo NO; fi
          echo "LOCAL_ENTRAR_PRESENT:"
          if grep -q "Preparando tu espacio" app/page.tsx; then echo YES; else echo NO; fi
          echo "LOCAL_PAGE_DIFF:"
          git diff -- app/page.tsx | head -70 || true
          echo "GIT_LANDING_PRESENT:"
          if git show HEAD:app/page.tsx | grep -q "Tarjetas de fidelización"; then echo "YES"; else echo "NO"; fi
          echo "NEXT_CONTAINER_STATUS:"
          docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | grep -E '^lp-web-1 ' || true
          echo "DYNAMIC_SOURCE_FLAG:"
          if grep -q 'export const dynamic = "force-dynamic"' app/page.tsx; then echo PRESENT; else echo ABSENT; fi
          echo "COMPILED_PAGE_MARKERS:"
          docker exec lp-web-1 node -e 'const fs=require("fs");for(const f of ["/app/.next/server/app/page.js","/app/.next/server/app/entrar/page.js","/app/.next/server/app/index.html"]){if(!fs.existsSync(f))continue;const s=fs.readFileSync(f,"utf8");console.log(f,"bytes="+s.length,"home="+s.includes("Tarjetas de fidelización"),"router="+s.includes("Preparando tu espacio"),"dynamic="+s.includes("force-dynamic"));}' || true
          echo "LOCATE_LANDING_IN_COMPILED_IMAGE:"
          docker exec lp-web-1 sh -c 'grep -rl "Tarjetas de fidelización" /app/.next/server 2>/dev/null | head -15' || true
          docker exec lp-web-1 sh -c 'grep -rl "Loyally transforma" /app/.next/server 2>/dev/null | head -15' || true
          echo "ROOT_MODULE_FIRST_CHARS:"
          docker exec lp-web-1 node -e 'const f=require("fs").readFileSync("/app/.next/server/app/page.js","utf8");console.log(f.slice(0,580).replace(/\\n/g," "));'
          echo "NEXT_BUILD_ROOT_FILES:"
          docker exec lp-web-1 sh -c 'ls -l /app/.next/server/app/index.html /app/.next/server/app/entrar.html /app/.next/server/app/page.js 2>/dev/null || true'
          echo "NEXT_BUILD_ROOT_MARKERS:"
          docker exec lp-web-1 sh -c 'for f in /app/.next/server/app/index.html /app/.next/server/app/entrar.html; do if test -f "$f"; then echo "$f"; for marker in "Tarjetas de fidelización" "Preparando tu espacio" "Accede a tu espacio"; do if grep -q "$marker" "$f"; then echo "MARKER: $marker"; fi; done; fi; done'
          echo "NEXT_ROUTE_CONFIG:"
          docker exec lp-web-1 node -e 'try { const m=require("/app/.next/routes-manifest.json"); console.log(JSON.stringify({redirects:m.redirects,rewrites:m.rewrites}).slice(0,1200)) } catch(e) { console.log("UNAVAILABLE",e.message) }' || true
          if test -r /etc/caddy/Caddyfile; then
            echo "CADDY_ROUTE_LINES:"
            grep -nE '169[.]58[.]121[.]198|redir|rewrite|reverse_proxy|handle|route|3100' /etc/caddy/Caddyfile | cut -c1-240 || true
          else
            echo "CADDYFILE: no es legible con el usuario SSH"
          fi
          REMOTE
