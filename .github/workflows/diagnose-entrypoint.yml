name: Diagnosticar entrada publica de Loyally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar-rutas:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar raiz publica y acceso de la IP
        shell: bash
        run: |
          set -u
          for url in "http://169.58.121.198/" "https://169.58.121.198/" "https://169.58.121.198/acceder"; do
            echo "===== $url ====="
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -k -sS --max-time 18 -D "$headers" -o "$body" -w "%{http_code}" "$url" || true)"
            echo "HTTP: $code"
            grep -Ei '^(HTTP/|location:|server:)' "$headers" || true
            if grep -q "Haz que cada visita" "$body"; then
              echo "CONTENIDO: PRESENTACION LOYALLY"
            elif grep -q "Accede a tu espacio" "$body"; then
              echo "CONTENIDO: LOGIN /ACCEDeR"
            elif grep -q "Falta un paso para empezar" "$body"; then
              echo "CONTENIDO: ERROR APLICACION"
            else
              echo "CONTENIDO: NO IDENTIFICADO"
            fi
            node - "$body" <<'NODE'
          const fs=require("node:fs");
          const html=fs.readFileSync(process.argv[2],"utf8");
          const extract=(regex)=>{const match=html.match(regex);return match?match[1].replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,200):"sin etiqueta"};
          console.log("TITLE:",extract(/<title[^>]*>([\s\S]*?)<\/title>/i));
          console.log("H1:",extract(/<h1[^>]*>([\s\S]*?)<\/h1>/i));
          console.log("BODY_FIRST:",html.slice(0,320).replace(/\s+/g," "));
          for(const phrase of ["Preparando tu espacio", "Redirigiendo al acceso", "Loyally transforma", "Accede a tu espacio", "Haz que cada visita"]){
            if(html.includes(phrase))console.log("MARCADOR:",phrase);
          }
          NODE
            rm -f "$headers" "$body"
          done

  revisar-proxy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Comparar Next.js directo con Caddy y revisar solo rutas relevantes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          LP_SSH_KNOWN_HOSTS: ${{ secrets.LP_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          if [[ -n "$LP_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$LP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 15 -p "$PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          cd /opt/lp
          echo "DEPLOYED_GIT: $(git log -1 --format=%h)"
          for path in / /entrar /acceder; do
            tmp="$(mktemp)"
            status="$(curl -sS --max-time 15 -o "$tmp" -w "%{http_code}" "http://127.0.0.1:3100$path" || true)"
            echo "NEXT_DIRECT: $path = $status"
            for phrase in "Haz que cada visita" "Preparando tu espacio" "Accede a tu espacio"; do
              if grep -q "$phrase" "$tmp"; then echo "MARKER: $phrase"; fi
            done
            rm -f "$tmp"
          done
          echo "LOCAL_WORKTREE_STATUS:"
          git status --short -- app/page.tsx || true
          echo "LOCAL_LANDING_PRESENT:"
          if grep -q "Haz que cada visita" app/page.tsx; then echo YES; else echo NO; fi
          echo "LOCAL_ENTRAR_PRESENT:"
          if grep -q "Preparando tu espacio" app/page.tsx; then echo YES; else echo NO; fi
          echo "LOCAL_PAGE_DIFF:"
          git diff -- app/page.tsx | head -70 || true
          echo "GIT_LANDING_PRESENT:"
          if git show HEAD:app/page.tsx | grep -q "Haz que cada visita"; then echo "YES"; else echo "NO"; fi
          echo "NEXT_CONTAINER_STATUS:"
          docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | grep -E '^lp-web-1 ' || true
          echo "NEXT_BUILD_ROOT_FILES:"
          docker exec lp-web-1 sh -c 'ls -l /app/.next/server/app/index.html /app/.next/server/app/entrar.html /app/.next/server/app/page.js 2>/dev/null || true'
          echo "NEXT_BUILD_ROOT_MARKERS:"
          docker exec lp-web-1 sh -c 'for f in /app/.next/server/app/index.html /app/.next/server/app/entrar.html; do if test -f "$f"; then echo "$f"; for marker in "Haz que cada visita" "Preparando tu espacio" "Accede a tu espacio"; do if grep -q "$marker" "$f"; then echo "MARKER: $marker"; fi; done; fi; done'
          echo "NEXT_ROUTE_CONFIG:"
          docker exec lp-web-1 node -e 'try { const m=require("/app/.next/routes-manifest.json"); console.log(JSON.stringify({redirects:m.redirects,rewrites:m.rewrites}).slice(0,1200)) } catch(e) { console.log("UNAVAILABLE",e.message) }' || true
          if test -r /etc/caddy/Caddyfile; then
            echo "CADDY_ROUTE_LINES:"
            grep -nE '169[.]58[.]121[.]198|redir|rewrite|reverse_proxy|handle|route|3100' /etc/caddy/Caddyfile | cut -c1-240 || true
          else
            echo "CADDYFILE: no es legible con el usuario SSH"
          fi
          REMOTE
