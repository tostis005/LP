name: CRM - Canal de órdenes
on:
  pull_request:
    paths:
      - '.github/workflows/crm-channel-probe.yml'
      - 'scripts/crm-github-command.mjs'
      - 'app/api/local/admin/crm/campaigns/puebla/**'
      - 'components/AdminCrmPueblaCampaign.tsx'
      - 'db/migrations/999_zz_crm_github_channel.sql'
      - 'tests/demo/crm-github-channel.mjs'
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: lp-crm-command-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/demo/crm-github-channel.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
  probe:
    if: github.repository == 'tostis005/LP' && github.event.issue.number == 84 && !github.event.issue.pull_request && github.event.comment.user.id == 23707815 && github.event.comment.user.login == 'tostis005' && github.actor == 'tostis005' && github.triggering_actor == 'tostis005' && github.event.comment.body == '/crm ping'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar canal
        run: echo 'CRM_CHANNEL_PROBE_OK'

  server:
    if: github.repository == 'tostis005/LP' && github.event.issue.number == 84 && !github.event.issue.pull_request && github.event.comment.user.id == 23707815 && github.event.comment.user.login == 'tostis005' && github.actor == 'tostis005' && github.triggering_actor == 'tostis005' && (github.event.comment.body == '/crm puebla preview' || startsWith(github.event.comment.body, '/crm puebla send '))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Ejecutar operación permitida
        shell: bash
        env:
          ORDER_ID: ${{ github.event.comment.id }}
          ORDER_TEXT: ${{ github.event.comment.body }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          LP_SSH_KNOWN_HOSTS: ${{ secrets.LP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$ORDER_ID" =~ ^[0-9]{1,20}$ ]] || exit 2
          if [[ "$ORDER_TEXT" == "/crm puebla preview" ]]; then
            OPERATION=preview; COUNT=0
          elif [[ "$ORDER_TEXT" =~ ^/crm\ puebla\ send\ ([1-9][0-9]{0,9})$ ]]; then
            OPERATION=send; COUNT="${BASH_REMATCH[1]}"
            (( COUNT <= 2147483647 )) || exit 2
          else exit 2; fi
          [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]] || { echo 'Faltan credenciales SSH'; exit 2; }
          PORT="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          trap 'rm -f "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts" "$HOME/.ssh/crm-stderr"' EXIT
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_deploy" >/dev/null 2>&1; then echo 'CRM_DIAG invalid_client_key'; exit 2; fi
          if [[ -n "$LP_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$LP_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
            LOOKUP="$VPS_HOST"
            if [[ "$PORT" != 22 ]]; then LOOKUP="[$VPS_HOST]:$PORT"; fi
            if ! ssh-keygen -F "$LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
              # Accept one explicitly supplied public host key, with or without a hostname.
              # Never obtain a replacement key from the network or disable strict checking.
              PIN=$(awk 'NF && $1 !~ /^#/ { n++; if ($1 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$1 " " $2 } else if ($1 !~ /^@/ && $2 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$2 " " $3 } } END { if(n==1 && k!="") print k; else exit 1 }' "$HOME/.ssh/known_hosts") || { echo 'CRM_DIAG invalid_host_key_format'; exit 2; }
              printf '%s %s\n' "$LOOKUP" "$PIN" > "$HOME/.ssh/known_hosts"
              if ! ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then echo 'CRM_DIAG invalid_host_key_format'; exit 2; fi
              echo 'CRM_DIAG pinned_host_key_format_normalized'
            fi
          else
            echo 'Falta LP_SSH_KNOWN_HOSTS: el canal comercial exige una huella SSH previamente verificada.'
            exit 2
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          HOST_LOOKUP="$VPS_HOST"
          if [[ "$PORT" != 22 ]]; then HOST_LOOKUP="[$VPS_HOST]:$PORT"; fi
          if ! ssh-keygen -F "$HOST_LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo 'CRM_DIAG known_hosts_missing_matching_host'; exit 2
          fi
          set +e
          output=$(ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "bash -se -- $OPERATION $ORDER_ID $COUNT" 2>"$HOME/.ssh/crm-stderr" <<'REMOTE'
          set -euo pipefail
          echo 'CRM_DIAG ssh_connected'
          cd /opt/lp || { echo 'CRM_DIAG project_path_missing'; exit 2; }
          echo 'CRM_DIAG project_path_ready'
          COMPOSE=(docker compose)
          if ! test -r .env.production || ! docker info </dev/null >/dev/null 2>&1; then
            sudo -n docker info </dev/null >/dev/null 2>&1 || { echo 'CRM_DIAG docker_access_denied'; exit 2; }
            COMPOSE=(sudo -n docker compose)
          fi
          echo 'CRM_DIAG docker_ready'
          if ! "${COMPOSE[@]}" --env-file .env.production exec -T automation-worker node -e 'const fs=require("fs"); if(!fs.existsSync("scripts/crm-github-command.mjs"))process.exit(2); if(process.env.PGUSER!=="lp_auth"||!process.env.PGPASSWORD)process.exit(3);' </dev/null >/dev/null 2>&1; then
            echo 'CRM_DIAG worker_unavailable_or_stale'; exit 2
          fi
          echo 'CRM_DIAG worker_ready'
          # Read-only audit of the most recent single-email order.
          if [[ "$1" == preview ]]; then
            "${COMPOSE[@]}" --env-file .env.production exec -T web node - <<'AUDIT' || echo 'CRM_AUDIT audit_unavailable'
          const {Pool}=require("pg"),{createHash,createDecipheriv}=require("node:crypto");
          const opts={host:process.env.PGHOST,port:Number(process.env.PGPORT||5432),database:process.env.PGDATABASE,connectionTimeoutMillis:5000,max:1};
          const auth=new Pool({...opts,user:process.env.AUTH_PGUSER,password:process.env.AUTH_PGPASSWORD}),db=new Pool({...opts,user:process.env.PGUSER,password:process.env.PGPASSWORD});
          const emit=s=>console.log("CRM_AUDIT "+s);
          function unseal(value){
            const key=createHash("sha256").update("kreyvi-crm-mailbox-v1:"+(process.env.SENDCOREX_ENCRYPTION_KEY||process.env.AUTH_PGPASSWORD)).digest();
            const [iv,tag,body]=value.split(".").map(v=>Buffer.from(v,"base64url"));
            const cipher=createDecipheriv("aes-256-gcm",key,iv);cipher.setAuthTag(tag);
            return JSON.parse(Buffer.concat([cipher.update(body),cipher.final()]).toString("utf8"));
          }
          async function call(path,token,command,args){
            const res=await fetch("https://g.sendcorex.com/v1"+path,{method:"POST",headers:{Authorization:token,"Content-Type":"application/json"},body:JSON.stringify({commands:[{command,args}]}),redirect:"error",signal:AbortSignal.timeout(12000)});
            const json=await res.json().catch(()=>null),r=json?.results?.[0];
            if(!res.ok||r?.type!=="SUCCESS"){
              const code=String(r?.code||json?.code||"");
              return {error:["TOKEN_EXPIRED","INVALID_TOKEN","MISSING_AUTH_HEADER","RATE_LIMITED","READ_ONLY_ACCESS","MISSING_SCOPE","AUTH_UNAVAILABLE"].includes(code)?code:"PROVIDER_ERROR"};
            }
            return {data:r.data};
          }
          (async()=>{
            let c;
            try{
              const actor=(await auth.query("SELECT id,email FROM auth.users WHERE id=public.crm_github_actor() AND email_confirmed_at IS NOT NULL")).rows[0];
              if(!actor){emit("no_actor");return;}
              c=await db.connect();await c.query("BEGIN READ ONLY");await c.query("SET LOCAL ROLE authenticated");await c.query("SELECT set_config('request.jwt.claim.sub',$1,true),set_config('request.jwt.claim.email',$2,true)",[actor.id,actor.email]);
              if(!(await c.query("SELECT public.is_platform_admin() AS allowed")).rows[0]?.allowed){emit("no_actor");return;}
              const mailbox=(await c.query("SELECT email,secret,logs_secret FROM public.crm_mailbox WHERE id=true")).rows[0];
              const order=(await c.query("SELECT state,queued,requested_count,created_at FROM public.crm_github_orders ORDER BY created_at DESC LIMIT 1")).rows[0];
              const attempts=order&&order.requested_count===1?(await c.query("SELECT recipient,created_at FROM public.crm_mail_attempts WHERE created_at >= $1 AND created_at < $1::timestamptz+interval '1 minute' ORDER BY created_at LIMIT 2",[order.created_at])).rows:[];
              await c.query("ROLLBACK");c.release();c=null;
              if(!mailbox){emit("no_mailbox");return;}
              const domain=String(mailbox.email||"").toLowerCase().split("@")[1];
              emit(!domain?"sender_missing":domain==="kreyvi.com"||domain.endsWith(".kreyvi.com")?"sender_primary_domain":domain==="kreyviapp.com"||domain.endsWith(".kreyviapp.com")?"sender_alternate_domain":"sender_domain_allowed");
              const who=await call("",unseal(mailbox.secret).token,"whoami",{});
              emit(who.error?"mailbox_"+who.error:"mailbox_ok");
              if(!order||order.requested_count!==1){emit("no_single_order");return;}
              emit("order_"+(["started","completed","stopped"].includes(order.state)?order.state:"unknown")+" "+Number(order.queued)+" "+attempts.length);
              if(attempts.length!==1)return;
              if(mailbox.logs_secret){
                const logs=await call("/logs",unseal(mailbox.logs_secret).token,"list_logs",{recipient:attempts[0].recipient,from:mailbox.email,after:new Date(order.created_at).toISOString(),subject:"Aumenta la retención de tus clientes y tu rentabilidad con Kreyvi",limit:10});
                if(logs.error)emit("logs_"+logs.error);
                else if(Array.isArray(logs.data?.logs)){const records=logs.data.logs;emit("logs "+records.length+" "+records.filter(r=>r.status==="delivered").length+" "+records.filter(r=>r.blocked===true).length);}
                else emit("logs_unavailable");
              }else emit("logs_unavailable");
              if(!who.error){
                const sent=await call("",unseal(mailbox.secret).token,"list_messages",{folder:"Sent",after:new Date(order.created_at).toISOString(),limit:100});
                if(sent.error)emit("sent_"+sent.error);
                else if(Array.isArray(sent.data?.messages)){const matches=sent.data.messages.filter(m=>m.subject==="Aumenta la retención de tus clientes y tu rentabilidad con Kreyvi");emit("sent_subject_matches "+matches.length+" "+(sent.data.has_more?1:0));}
                else emit("sent_unavailable");
              }
            }catch{emit("audit_unavailable");}
            finally{if(c){await c.query("ROLLBACK").catch(()=>{});c.release();}await Promise.all([auth.end(),db.end()]);}
          })();
          AUDIT
          fi
          "${COMPOSE[@]}" --env-file .env.production exec -T automation-worker node scripts/crm-github-command.mjs "$1" "$2" "$3" </dev/null
          REMOTE
          )
          rc=$?
          set -e
          result=$(printf '%s\n' "$output" | grep -E '^CRM_RESULT (enabled|disabled|not_ready|completed|stopped|already_processed|unauthorized|invalid|error) [0-9]{1,10} [0-9]{1,10}$' | tail -1 || true)
          printf '%s\n' "$output" | grep -E '^CRM_DIAG (ssh_connected|project_path_missing|project_path_ready|docker_access_denied|docker_ready|worker_unavailable_or_stale|worker_ready)$' || true
          if [[ -z "$result" ]]; then
            if grep -Eqi 'host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED|No .* host key is known' "$HOME/.ssh/crm-stderr"; then echo 'CRM_DIAG host_key_verification_failed'
            elif grep -Eqi 'Permission denied|Authentication failed' "$HOME/.ssh/crm-stderr"; then echo 'CRM_DIAG ssh_authentication_denied'
            elif grep -Eqi 'Connection timed out|Connection refused|No route to host|Could not resolve hostname' "$HOME/.ssh/crm-stderr"; then echo 'CRM_DIAG ssh_network_unavailable'
            elif [[ "$rc" == 255 ]]; then echo 'CRM_DIAG ssh_transport_failed'
            else echo 'CRM_DIAG remote_command_failed'; fi
            echo 'CRM_RESULT error 0 0'; exit 1
          fi
          printf '%s\n' "$output" | grep -E '^CRM_AUDIT (audit_unavailable|no_actor|no_mailbox|no_single_order|sender_missing|sender_primary_domain|sender_alternate_domain|sender_domain_allowed|mailbox_(ok|TOKEN_EXPIRED|INVALID_TOKEN|MISSING_AUTH_HEADER|RATE_LIMITED|READ_ONLY_ACCESS|MISSING_SCOPE|AUTH_UNAVAILABLE|PROVIDER_ERROR)|order_(started|completed|stopped|unknown) [0-9]+ [0-2]|logs [0-9]+ [0-9]+ [0-9]+|sent_subject_matches [0-9]+ [01]|(logs|sent)_(unavailable|TOKEN_EXPIRED|INVALID_TOKEN|MISSING_AUTH_HEADER|RATE_LIMITED|READ_ONLY_ACCESS|MISSING_SCOPE|AUTH_UNAVAILABLE|PROVIDER_ERROR))$' || true
          printf '%s\n' "$result"
          printf '%s\n' "$output" | grep -E '^CRM_REASON (NONE|TOKEN_EXPIRED|INVALID_TOKEN|MISSING_AUTH_HEADER|READ_ONLY_ACCESS|RECIPIENT_UNSUBSCRIBED|NO_CREDITS|RATE_LIMITED|INVALID_ARGS|INVALID_TOADDRESS|SENDER_NOT_FOUND|SENDER_NO_DOMAIN|AUTH_UNAVAILABLE|INTERNAL|MARKETING_LIMIT_REACHED|DAILY_LIMIT|ACCOUNT_RESTRICTED|SPAM_DETECTED|UNSUBSCRIBE_UNAVAILABLE|FORBIDDEN_HTML_CONTENT|PAID_PLAN_REQUIRED|PROVIDER_NETWORK|PROVIDER_REJECTED|REFRESH_FAILED|DB_PERMISSION|DB_CONSTRAINT|CRM_REJECTED_[0-9]{3}|DEADLINE|QUEUE_UNCONFIRMED|UNKNOWN)$' || true
          exit "$rc"
