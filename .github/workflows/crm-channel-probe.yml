name: CRM - Canal de órdenes
on:
  pull_request:
    paths:
      - '.github/workflows/crm-channel-probe.yml'
      - 'scripts/crm-github-command.mjs'
      - 'app/api/local/admin/crm/campaigns/puebla/**'
      - 'components/AdminCrmPueblaCampaign.tsx'
      - 'db/migrations/999_zz_crm_github_channel.sql'
      - 'tests/demo/crm-github-channel.mjs'
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: lp-crm-command-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/demo/crm-github-channel.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
  probe:
    if: github.repository == 'tostis005/LP' && github.event.issue.number == 84 && !github.event.issue.pull_request && github.event.comment.user.id == 23707815 && github.event.comment.user.login == 'tostis005' && github.actor == 'tostis005' && github.triggering_actor == 'tostis005' && github.event.comment.body == '/crm ping'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar canal
        run: echo 'CRM_CHANNEL_PROBE_OK'

  server:
    if: github.repository == 'tostis005/LP' && github.event.issue.number == 84 && !github.event.issue.pull_request && github.event.comment.user.id == 23707815 && github.event.comment.user.login == 'tostis005' && github.actor == 'tostis005' && github.triggering_actor == 'tostis005' && (github.event.comment.body == '/crm puebla preview' || startsWith(github.event.comment.body, '/crm puebla send '))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Ejecutar operación permitida
        shell: bash
        env:
          ORDER_ID: ${{ github.event.comment.id }}
          ORDER_TEXT: ${{ github.event.comment.body }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          LP_SSH_KNOWN_HOSTS: ${{ secrets.LP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$ORDER_ID" =~ ^[0-9]{1,20}$ ]] || exit 2
          if [[ "$ORDER_TEXT" == "/crm puebla preview" ]]; then
            OPERATION=preview; COUNT=0
          elif [[ "$ORDER_TEXT" =~ ^/crm\ puebla\ send\ ([1-9][0-9]{0,9})$ ]]; then
            OPERATION=send; COUNT="${BASH_REMATCH[1]}"
            (( COUNT <= 2147483647 )) || exit 2
          else exit 2; fi
          [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]] || { echo 'Faltan credenciales SSH'; exit 2; }
          PORT="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          trap 'rm -f "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts" "$HOME/.ssh/crm-stderr"' EXIT
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_deploy" >/dev/null 2>&1; then echo 'CRM_DIAG invalid_client_key'; exit 2; fi
          if [[ -n "$LP_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$LP_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
            LOOKUP="$VPS_HOST"
            if [[ "$PORT" != 22 ]]; then LOOKUP="[$VPS_HOST]:$PORT"; fi
            if ! ssh-keygen -F "$LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
              # Accept one explicitly supplied public host key, with or without a hostname.
              # Never obtain a replacement key from the network or disable strict checking.
              PIN=$(awk 'NF && $1 !~ /^#/ { n++; if ($1 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$1 " " $2 } else if ($1 !~ /^@/ && $2 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/) { k=$2 " " $3 } } END { if(n==1 && k!="") print k; else exit 1 }' "$HOME/.ssh/known_hosts") || { echo 'CRM_DIAG invalid_host_key_format'; exit 2; }
              printf '%s %s\n' "$LOOKUP" "$PIN" > "$HOME/.ssh/known_hosts"
              if ! ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then echo 'CRM_DIAG invalid_host_key_format'; exit 2; fi
              echo 'CRM_DIAG pinned_host_key_format_normalized'
            fi
          else
            echo 'Falta LP_SSH_KNOWN_HOSTS: el canal comercial exige una huella SSH previamente verificada.'
            exit 2
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          HOST_LOOKUP="$VPS_HOST"
          if [[ "$PORT" != 22 ]]; then HOST_LOOKUP="[$VPS_HOST]:$PORT"; fi
          if ! ssh-keygen -F "$HOST_LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo 'CRM_DIAG known_hosts_missing_matching_host'; exit 2
          fi
          set +e
          output=$(ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "bash -se -- $OPERATION $ORDER_ID $COUNT" 2>"$HOME/.ssh/crm-stderr" <<'REMOTE'
          set -euo pipefail
          echo 'CRM_DIAG ssh_connected'
          cd /opt/lp || { echo 'CRM_DIAG project_path_missing'; exit 2; }
          echo 'CRM_DIAG project_path_ready'
          COMPOSE=(docker compose)
          if ! test -r .env.production || ! docker info </dev/null >/dev/null 2>&1; then
            sudo -n docker info </dev/null >/dev/null 2>&1 || { echo 'CRM_DIAG docker_access_denied'; exit 2; }
            COMPOSE=(sudo -n docker compose)
          fi
          echo 'CRM_DIAG docker_ready'
          if ! "${COMPOSE[@]}" --env-file .env.production exec -T automation-worker node -e 'const fs=require("fs"); if(!fs.existsSync("scripts/crm-github-command.mjs"))process.exit(2); if(process.env.PGUSER!=="lp_auth"||!process.env.PGPASSWORD)process.exit(3);' </dev/null >/dev/null 2>&1; then
            echo 'CRM_DIAG worker_unavailable_or_stale'; exit 2
          fi
          echo 'CRM_DIAG worker_ready'
          "${COMPOSE[@]}" --env-file .env.production exec -T automation-worker node scripts/crm-github-command.mjs "$1" "$2" "$3" </dev/null
          REMOTE
          )
          rc=$?
          set -e
          result=$(printf '%s\n' "$output" | grep -E '^CRM_RESULT (enabled|disabled|not_ready|completed|stopped|already_processed|unauthorized|invalid|error) [0-9]{1,10} [0-9]{1,10}$' | tail -1 || true)
          printf '%s\n' "$output" | grep -E '^CRM_DIAG (ssh_connected|project_path_missing|project_path_ready|docker_access_denied|docker_ready|worker_unavailable_or_stale|worker_ready)$' || true
          if [[ -z "$result" ]]; then
            if grep -Eqi 'host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED|No .* host key is known' "$HOME/.ssh/crm-stderr"; then echo 'CRM_DIAG host_key_verification_failed'
            elif grep -Eqi 'Permission denied|Authentication failed' "$HOME/.ssh/crm-stderr"; then echo 'CRM_DIAG ssh_authentication_denied'
            elif grep -Eqi 'Connection timed out|Connection refused|No route to host|Could not resolve hostname' "$HOME/.ssh/crm-stderr"; then echo 'CRM_DIAG ssh_network_unavailable'
            elif [[ "$rc" == 255 ]]; then echo 'CRM_DIAG ssh_transport_failed'
            else echo 'CRM_DIAG remote_command_failed'; fi
            echo 'CRM_RESULT error 0 0'; exit 1
          fi
          printf '%s\n' "$result"
          exit "$rc"
