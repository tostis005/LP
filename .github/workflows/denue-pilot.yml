name: DENUE pilot aggregate analysis
on:
  pull_request:
    paths:
      - 'lib/server/denue.ts'
      - 'scripts/analyze-denue-pilot.mjs'
      - 'tests/native/denue.mjs'
      - '.github/workflows/denue-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/native/denue.mjs
      - name: Download official Baja California archive and calculate pilot totals
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          url='https://www.inegi.org.mx/contenidos/masiva/denue/2026_05/denue_02_0526_csv.zip'
          echo "DENUE edition 2026-05, state 02, municipality 02003"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 180 "$url" -o "$work/denue.zip"
          unzip -q "$work/denue.zip" -d "$work/extracted"
          mapfile -d '' files < <(find "$work/extracted" -type f -iname '*.csv' -path '*/conjunto_de_datos/*' -print0)
          node --experimental-strip-types scripts/analyze-denue-pilot.mjs "${files[@]}"
